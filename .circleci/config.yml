      - run:
          name: Load occluders
          command: |
            printf 'occluders = 12\n' > umbra.cfg
      - run:
          name: Build shadow solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target umbra -j2
      - run:
          name: Compute umbra region
          command: LIONSS_LP=1 ./build/umbra --config umbra.cfg --softness 0.2
  ThistleDown:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
